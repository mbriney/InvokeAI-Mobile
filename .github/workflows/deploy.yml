name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build config.js from repo variables/secrets
        env:
          INVOKE_URL: ${{ vars.INVOKE_URL }}
          APP_TITLE: ${{ vars.APP_TITLE }}
          DEFAULT_MODEL: ${{ vars.DEFAULT_MODEL }}
          MAX_SIZE: ${{ vars.MAX_SIZE }}
        run: node scripts/build-config.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
